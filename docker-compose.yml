services:
  radiobot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rose-cinema
    restart: unless-stopped
    ports:
      - "8765:8000"
    volumes:
      - /opt/containers/rose-cinema:/app/data
    environment:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6:27b}
      LLM_API_KEY: ollama
      TTS_PROVIDER: piper
      PIPER_DATA_DIR: /app/data/piper_models
      MUSICKIT_TEAM_ID: ${MUSICKIT_TEAM_ID:-}
      MUSICKIT_KEY_ID: ${MUSICKIT_KEY_ID:-}
      MUSICKIT_PRIVATE_KEY: ${MUSICKIT_PRIVATE_KEY:-}
      MUSICKIT_STOREFRONT: ${MUSICKIT_STOREFRONT:-us}
      MA_URL: ${MA_URL:-}
      MA_TOKEN: ${MA_TOKEN:-}
      MA_DEFAULT_PLAYER_ID: ${MA_DEFAULT_PLAYER_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CHATTERBOX_URL: ${CHATTERBOX_URL:-http://host.docker.internal:8004}
    extra_hosts:
      # Reach the host (where Ollama and Music Assistant run as separate stacks)
      - "host.docker.internal:host-gateway"
