services:
  postgres:
    image: postgres:alpine
    container_name: rose-cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rose_cinema
      POSTGRES_USER: rose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rose}
    volumes:
      - /opt/containers/rose-cinema-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rose -d rose_cinema"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  radiobot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rose-cinema
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8765:8000"
    volumes:
      - /opt/containers/rose-cinema:/app/data
    environment:
      DATABASE_URL: postgresql+asyncpg://rose:${POSTGRES_PASSWORD:-rose}@postgres:5432/rose_cinema
      LLM_PROVIDER: ollama
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6:27b}
      LLM_API_KEY: ollama
      TTS_PROVIDER: piper
      PIPER_DATA_DIR: /app/data/piper_models
      MUSICKIT_TEAM_ID: ${MUSICKIT_TEAM_ID:-}
      MUSICKIT_KEY_ID: ${MUSICKIT_KEY_ID:-}
      MUSICKIT_PRIVATE_KEY: ${MUSICKIT_PRIVATE_KEY:-}
      MUSICKIT_STOREFRONT: ${MUSICKIT_STOREFRONT:-us}
      MA_URL: ${MA_URL:-}
      MA_TOKEN: ${MA_TOKEN:-}
      MA_DEFAULT_PLAYER_ID: ${MA_DEFAULT_PLAYER_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CHATTERBOX_URL: ${CHATTERBOX_URL:-http://host.docker.internal:8004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
