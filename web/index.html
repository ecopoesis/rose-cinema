<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rose Cinema</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.45 -apple-system, system-ui, sans-serif;
         background: #111; color: #eee; margin: 0; padding: 2rem;
         max-width: 720px; margin-inline: auto; }
  h1 { font-weight: 500; letter-spacing: -0.02em; margin: 0 0 1.5rem; }
  .stations { display: grid; gap: 0.75rem; }
  .station { background: #1a1a1a; border: 1px solid #2a2a2a;
             border-radius: 0.5rem; padding: 1rem; display: grid;
             grid-template-columns: 1fr auto; align-items: center; gap: 1rem; }
  .meta { font-size: 0.875rem; color: #888; }
  .name { font-weight: 500; }
  .seed { color: #aaa; font-size: 0.875rem; margin-top: 0.25rem; }
  button { background: #c8395a; color: white; border: 0;
           padding: 0.6rem 1rem; border-radius: 0.375rem; font: inherit;
           cursor: pointer; min-width: 9rem; }
  button:hover { background: #d4567a; }
  button:disabled { background: #444; cursor: wait; }
  .player { background: #222; border: 1px solid #333; border-radius: 0.375rem;
            padding: 0.5rem 0.75rem; color: #ccc; font-size: 0.875rem; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
           background: #2a2a2a; padding: 0.75rem 1.25rem; border-radius: 0.375rem;
           border: 1px solid #444; font-size: 0.875rem; }
  .toast.error { border-color: #c8395a; color: #ffb4c5; }
  .empty { color: #888; padding: 2rem; text-align: center;
           background: #1a1a1a; border-radius: 0.5rem; }
</style>
</head>
<body>
  <h1>🎙️ Rose Cinema</h1>

  <label class="meta">Player target:
    <select id="player" class="player"></select>
  </label>

  <div id="stations" class="stations"></div>
  <div id="toast" class="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const toast = (msg, isErr=false) => {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  t.classList.toggle('error', isErr);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.hidden = true, 4000);
};

async function loadPlayers() {
  // The server reads MA_DEFAULT_PLAYER_ID from env; we let the user override
  // by typing a player_id manually. For now just expose a single-option
  // dropdown of common values (we'll read from MA later).
  const sel = $('player');
  sel.innerHTML = '<option value="">(default from env)</option>';
}

async function loadStations() {
  const root = $('stations');
  root.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch('/api/stations');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const stations = await r.json();
    if (!stations.length) {
      root.innerHTML = '<div class="empty">No stations yet. Create one via the API:<br><br>' +
        '<code>POST /api/stations</code></div>';
      return;
    }
    root.innerHTML = '';
    stations.forEach(s => root.appendChild(renderStation(s)));
  } catch (e) {
    root.innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
  }
}

function renderStation(s) {
  const el = document.createElement('div');
  el.className = 'station';
  el.innerHTML = `
    <div>
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="meta">${s.length_minutes} min · talk ${s.dj_talk_rate} · babble ${s.dj_babble_rate}</div>
      ${s.music_source ? `<div class="seed">seed: ${escapeHtml(s.music_source)}</div>` : ''}
    </div>
    <button>Generate &amp; Play</button>
  `;
  el.querySelector('button').addEventListener('click', (e) => generateAndPlay(s, e.target));
  return el;
}

async function generateAndPlay(station, btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  try {
    btn.textContent = 'Generating…';
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({station_id: station.id})
    });
    if (!r.ok) throw new Error(`generate: ${r.status} ${await r.text()}`);
    const run = await r.json();

    btn.textContent = 'Sending to MA…';
    const playerOverride = $('player').value;
    const playReq = playerOverride ? {player_id: playerOverride} : {};
    const p = await fetch(`/api/runs/${run.id}/play`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(playReq)
    });
    if (!p.ok) throw new Error(`play: ${p.status} ${await p.text()}`);
    const playResp = await p.json();
    toast(`Playing ${playResp.queued} entries on ${playResp.player_id}`);
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

loadPlayers();
loadStations();
</script>
</body>
</html>
